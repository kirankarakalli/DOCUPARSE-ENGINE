
name: DocuParse Engine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
        run: python -m pytest -v

      - name: Build FastAPI Docker image
        run: docker build -f Dockerfile -t docuparse-api:ci .

      - name: Build Gradio Docker image
        run: docker build -f Dockerfile.gradio -t docuparse-gradio:ci .
